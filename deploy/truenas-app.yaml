# ChampMan Online: TrueNAS SCALE Custom App
# Apps → Discover Apps → ⋮ (top right) → Install via YAML. Name it "champmanonline" and paste this.
#
# Before installing:
#   1. Create the datasets (Datasets → Add Dataset, preset "Apps"):
#        <pool>/apps/champmanonline/data    database + every player's saves (back this up)
#        <pool>/apps/champmanonline/games   copy of the "Game Files" folder, one sub-folder per game
#      Both owned by the "apps" user (uid/gid 568).
#   2. Replace the CHANGE_ME values below.
#
# Ports: nothing is opened on your router; Cloudflare Tunnel makes an outbound connection.
# 30080 on the NAS is for LAN access/health checks only (it was free when checked).

services:
  app:
    image: ghcr.io/moran1804/champmanonline:latest
    pull_policy: always
    restart: unless-stopped
    user: "568:568"
    environment:
      # The admin account is created on first start. Sign in with this username and password.
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: CHANGE_ME_admin_password
      # New players sign up with a username and password and can play immediately.
      # Set to "true" to make new accounts wait for an admin to approve them instead.
      REQUIRE_APPROVAL: "false"
      # Cloudflare serves the site over HTTPS, so session cookies are Secure-only.
      COOKIE_SECURE: "true"
      TZ: Europe/London
      # Windows-game seats (the services below) and the secret the app uses to control them.
      SEATS: seat1,seat2,seat3,seat4
      SEAT_TOKEN: CHANGE_ME_random_secret
    volumes:
      - /mnt/CHANGE_ME_POOL/apps/champmanonline/data:/data
      - /mnt/CHANGE_ME_POOL/apps/champmanonline/games:/games:ro
    ports:
      - "30080:8080"
    # Time to save running Windows-game sessions when the app is stopped or updated.
    stop_grace_period: 60s
    depends_on:
      - seat1
      - seat2
      - seat3
      - seat4

  # Windows games: each seat runs one player's game (Wine on a virtual screen) and streams it via the app.
  # To allow more players at once, copy a seat (seat5: *seat) and add its name to SEATS above.
  seat1: &seat
    image: ghcr.io/moran1804/champmanonline-seat:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      SEAT_TOKEN: CHANGE_ME_random_secret
    volumes:
      - /mnt/CHANGE_ME_POOL/apps/champmanonline/games:/games:ro
    mem_limit: 1536m
    cpus: 2
  seat2: *seat
  seat3: *seat
  seat4: *seat

  cloudflared:
    image: cloudflare/cloudflared:latest
    pull_policy: always
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Cloudflare Zero Trust → Networks → Tunnels → your tunnel → install token (the long eyJ... string).
      # In the tunnel's Public Hostname: champmanonline.co.uk → Service: HTTP, URL: app:8080
      TUNNEL_TOKEN: CHANGE_ME_tunnel_token
    depends_on:
      - app
