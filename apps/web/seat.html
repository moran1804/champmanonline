<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex" />
    <title>Player</title>
    <style>
      html,
      body,
      #screen {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        /* Touches are handled by our own code: no scrolling, zooming or long-press menus. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body>
    <!-- Windows-game viewer (noVNC), embedded in an iframe by the Play page, like the DOS player. -->
    <div id="screen"></div>
    <script type="module" src="/src/seat/main.ts"></script>
  </body>
</html>
